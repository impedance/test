name: Temporary model bridge

on:
  pull_request:
    paths:
      - temporary-model-trigger.txt

permissions:
  contents: read

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper base q5 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ggml-base-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          echo '422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898  ggml-base-q5_1.bin' | sha256sum -c -
          zip -9 whisper-base-model.zip ggml-base-q5_1.bin
      - name: Upload model archive
        uses: actions/upload-artifact@v4
        with:
          name: whisper-base-model
          path: whisper-base-model.zip
          if-no-files-found: error
          retention-days: 1
